name: Sync upstream (branches / tags / releases)

# 将上游 AIPentest/CyberStrikeAI 的 分支 + Tags + Releases 自动镜像到本 fork。
#
# 重要前提：定时任务只从默认分支运行，所以本文件必须待在 main 上，
# 这会让 main 相对上游产生自己的提交（分叉）。
#
# 同步策略：rebase —— 把 fork 的本地提交变基到上游 main 之上，并压成 1 个提交。
# 因此 main 的历史保持线性（无 merge 节点），且恒等于「上游 main + 1 个本地提交」，
# 上游文件内容与上游逐字节一致（仅多出本工作流文件）。
#
# 代价：上游每前进一次，main 会被 force-push 重写；fork 的克隆需要重新取。
# 注意：main 不能开启分支保护，否则 force-push 会被拒绝。
#
# 首次使用请到仓库 Actions 页面手动 Enable 本工作流：
#   公开仓库被 fork 后，scheduled workflow 默认处于 disabled 状态。
#
# 依赖：仓库 Settings → Secrets → Actions 需配置一个同时具备 repo 与 workflow
#   scope 的 PAT，名为 SYNC_TOKEN 或 CSAI 均可。原因见 "Sync default branch" 步骤。
#
on:
  schedule:
    # 每天 4 次（UTC 02:23 / 08:23 / 14:23 / 20:23），避开整点高峰以免排队延迟
    - cron: '23 2,8,14,20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: AIPentest/CyberStrikeAI

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # 不注入 GITHUB_TOKEN 凭据：它会以 http extraheader 形式存在，
          # 并覆盖我们自己 PAT URL 里的认证，导致推送仍然以 GITHUB_TOKEN 身份进行。
          persist-credentials: false

      # ---------- 1. 分支：把 fork 本地提交 rebase 到上游 main 之上 ----------
      - name: Sync default branch (rebase)
        env:
          # secret 名字写错会让同步彻底失效，所以两个常用名都认（SYNC_TOKEN 优先）
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.CSAI }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 为什么必须自备 PAT：GITHUB_TOKEN 是 GitHub App 安装令牌，而官方
          # permissions 可授权列表里根本没有 workflows 这一项，所以它永远拿不到
          # workflows 权限。一旦某次同步涉及 .github/workflows/ 下的新增或改动
          # （上游随便加个 CI 就会命中），服务端会直接拒绝整个 push：
          #   ! [remote rejected] ... without `workflows` permission
          # 因此推送一律走带 workflow scope 的 PAT。
          if [ -z "${SYNC_TOKEN:-}" ]; then
            echo "::error::secrets 里找不到 SYNC_TOKEN / CSAI —— 同步无法写入 .github/workflows/ 下的文件。"
            echo "::error::请创建 PAT：Settings → Developer settings → Personal access tokens → Tokens (classic)，"
            echo "::error::勾选 repo 与 workflow 两个 scope；再到仓库 Settings → Secrets → Actions 新增 SYNC_TOKEN。"
            exit 1
          fi
          REMOTE="https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git remote add upstream "https://github.com/${UPSTREAM}.git" 2>/dev/null || true
          git fetch --force "$REMOTE" "+refs/heads/main:refs/remotes/origin/main"
          git fetch --force upstream  "+refs/heads/main:refs/remotes/upstream/main"

          # 理想形态 = 上游 main 是 main 的祖先，且 main 只多 1 个本地提交。
          # 已满足则不重写历史，避免每次运行都产生无意义的 SHA 变动。
          ahead=$(git rev-list --count refs/remotes/upstream/main..refs/remotes/origin/main)
          if git merge-base --is-ancestor refs/remotes/upstream/main refs/remotes/origin/main \
             && [ "$ahead" -eq 1 ]; then
            echo "main is already upstream/main + 1 local commit, nothing to do"
            exit 0
          fi

          # 记下推送前的远端值，作为 --force-with-lease 的期望值：
          # 期间若有其他写入推过 main，本次推送会被拒绝，而不是静默覆盖别人。
          ORIG="$(git rev-parse refs/remotes/origin/main)"

          git checkout -B main "$ORIG"

          # 把本地提交变基到上游之上。rebase 默认会丢弃历史里的 merge 节点，
          # 因此首次运行会顺带把之前 merge 模式留下的 merge commit 线性化。
          if ! git rebase refs/remotes/upstream/main; then
            git rebase --abort || true
            echo "::error::rebase 失败：上游很可能重写了 main 的历史（force-push / rebase）。"
            echo "::error::修复方式：本地执行 git fetch upstream && git reset --hard upstream/main，"
            echo "::error::然后重新把 .github/workflows/sync-upstream.yml 提交到 main。"
            exit 1
          fi

          # 把本地提交压成单个提交，使 ahead_by 恒为 1。
          # 若日后需要保留多个相互独立的本地提交，删掉这段即可（届时 ahead_by = 本地提交数）。
          if [ "$(git rev-list --count refs/remotes/upstream/main..HEAD)" -gt 1 ]; then
            git reset --soft refs/remotes/upstream/main
            git commit -q -m "ci: fork-only upstream sync workflow"
          fi

          git push --force-with-lease=refs/heads/main:"${ORIG}" "$REMOTE" HEAD:refs/heads/main
          echo "main rebased onto upstream $(git rev-parse --short refs/remotes/upstream/main)"

      # ---------- 2. Tags：上游 tag 全部同步过来 ----------
      - name: Sync tags
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.CSAI }}
        run: |
          set -euo pipefail
          # tag 指向的提交同样可能包含 workflow 文件改动，因此也走 PAT
          REMOTE="https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git remote add upstream "https://github.com/${UPSTREAM}.git" 2>/dev/null || true
          git fetch upstream --tags --force
          git push "$REMOTE" --tags
          echo "tags synced"

      # ---------- 3. Releases：补齐缺失的 release（含标题/描述/预发布标记） ----------
      - name: Sync releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)

          # 上游 tag -> commit sha
          gh api --paginate --slurp "repos/${UPSTREAM}/tags?per_page=100" > "$work/tags.json"
          jq -r 'add | .[] | [.name, .commit.sha] | @tsv' "$work/tags.json" > "$work/tags.tsv"
          echo "upstream tags: $(wc -l < "$work/tags.tsv")"

          # 本 fork 已有的 release
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$work/dst.json"
          jq -r 'add // [] | .[] | .tag_name' "$work/dst.json" > "$work/existing.txt" || true
          touch "$work/existing.txt"
          echo "existing releases: $(wc -l < "$work/existing.txt")"

          # 上游 release，按 created_at 升序，逐行 compact JSON（避免正文换行破坏读取）
          gh api --paginate --slurp "repos/${UPSTREAM}/releases?per_page=100" > "$work/src.json"
          jq -c 'add | sort_by(.created_at) | .[]' "$work/src.json" > "$work/src.ndjson"
          echo "upstream releases: $(wc -l < "$work/src.ndjson")"

          created=0
          skipped=0
          failed=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            tag=$(printf '%s' "$line" | jq -r '.tag_name')
            if grep -qxF "$tag" "$work/existing.txt"; then
              skipped=$((skipped + 1))
              continue
            fi
            sha=$(awk -F'\t' -v t="$tag" '$1==t{print $2}' "$work/tags.tsv")
            if [ -z "$sha" ]; then
              echo "::warning::no commit sha for tag $tag, skipped"
              failed=$((failed + 1))
              continue
            fi
            printf '%s' "$line" | jq --arg sha "$sha" '{tag_name, target_commitish: $sha, name, body, draft, prerelease, make_latest: "true"}' > "$work/payload.json"
            if gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" --input "$work/payload.json" > /dev/null 2>"$work/err.txt"; then
              created=$((created + 1))
              echo "created release $tag -> ${sha:0:8}"
            elif grep -q 'already_exists' "$work/err.txt"; then
              # 请求实际已成功、但响应异常导致重试时命中此分支，视为成功
              created=$((created + 1))
              echo "release $tag already present, treated as ok"
            else
              failed=$((failed + 1))
              echo "::error::failed to create release $tag: $(cat "$work/err.txt")"
            fi
          done < "$work/src.ndjson"

          # 校正 Latest 标记，使其与上游一致
          # 注意：PATCH 用的是数字 release id，不存在 /releases/tags/{tag} 这个端点
          latest=$(gh api "repos/${UPSTREAM}/releases/latest" --jq '.tag_name' 2>/dev/null || true)
          if [ -n "$latest" ]; then
            rel_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${latest}" --jq '.id' 2>/dev/null || true)
            if [ -n "$rel_id" ]; then
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${rel_id}" -f make_latest=true > /dev/null
            else
              echo "::warning::cannot resolve release id for latest tag ${latest}"
            fi
          fi

          {
            echo "## Upstream sync result"
            echo ""
            echo "| item | value |"
            echo "|---|---|"
            echo "| repository | ${GITHUB_REPOSITORY} |"
            echo "| releases created | ${created} |"
            echo "| releases already present | ${skipped} |"
            echo "| failures | ${failed} |"
            echo "| latest release | ${latest:-n/a} |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "done: created=${created} skipped=${skipped} failed=${failed}"

          if [ "$failed" -gt 0 ]; then
            exit 1
          fi
